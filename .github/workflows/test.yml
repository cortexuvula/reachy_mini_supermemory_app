name: tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        # conftest.py stubs the upstream reachy_mini_conversation_app and
        # reachy_mini packages, so we don't need (and can't install) those
        # in CI. Just the dev tooling our tests actually use.
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8" "pytest-asyncio>=0.23" "respx>=0.21" "httpx>=0.27"

      - name: Run pytest
        run: python -m pytest tests/ -v
