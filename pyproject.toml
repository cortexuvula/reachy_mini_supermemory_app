[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_mini_supermemory_app"
version = "0.1.0"
authors = [{ name = "Andre Hugo" }]
description = "Reachy Mini conversation app with long-term memory backed by supermemory.ai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "reachy_mini_conversation_app",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx>=0.21",
  "ruff==0.12.0",
  "mypy==1.18.2",
]

[project.scripts]
reachy-mini-supermemory-app = "reachy_mini_supermemory_app.main:main"

[project.entry-points."reachy_mini_apps"]
reachy_mini_supermemory_app = "reachy_mini_supermemory_app.main:ReachyMiniSupermemoryApp"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reachy_mini_supermemory_app = ["static/*"]
reachy_mini_supermemory_profiles = ["profiles/**/*.txt", "profiles/**/*.py"]

[tool.ruff]
line-length = 119
exclude = [".venv", "dist", "build", "**/__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "D"]
ignore = ["E501", "D100", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["src/"]
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
